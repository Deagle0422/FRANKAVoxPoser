name: franka-voxposer

services:
  franka-control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: franka-voxposer/control:humble
    container_name: franka-voxposer-control
    network_mode: host
    ipc: host
    init: true
    tty: true
    stdin_open: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      FR3_ROBOT_IP: ${FR3_ROBOT_IP:-172.16.0.2}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./outputs:/workspace/outputs
    cap_add:
      - SYS_NICE
      - IPC_LOCK
      - NET_RAW
    security_opt:
      - seccomp=unconfined
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: -1
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /ros2_ws/install/setup.bash"]
      interval: 10s
      timeout: 3s
      retries: 5

  voxposer:
    build:
      context: .
      dockerfile: docker/voxposer.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: franka-voxposer/voxposer:py39
    container_name: franka-voxposer-planner
    network_mode: host
    init: true
    tty: true
    stdin_open: true
    depends_on:
      franka-control:
        condition: service_healthy
    environment:
      RGBD_STREAM_HOST: 127.0.0.1
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      PYTHONUNBUFFERED: "1"
    secrets:
      - deepseek_api_key
    volumes:
      - ./outputs:/workspace/outputs
      - ./voxposer/src/configs:/workspace/voxposer/src/configs:ro
    command: ["sleep", "infinity"]

  vision:
    profiles: ["vision"]
    build:
      context: .
      dockerfile: docker/vision.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: franka-voxposer/vision:sam2
    container_name: franka-voxposer-vision
    network_mode: host
    init: true
    environment:
      HF_HOME: /models/huggingface
      PYTHONUNBUFFERED: "1"
    volumes:
      - vision-models:/models
    command:
      - python
      - -m
      - perception.vision_service
      - --host
      - 127.0.0.1
      - --port
      - "8770"
      - --detector-model
      - google/owlv2-base-patch16-ensemble
      - --sam2-model
      - facebook/sam2.1-hiera-tiny
      - --device
      - auto
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

secrets:
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_FILE:-./secrets/deepseek_api_key.txt}

volumes:
  vision-models:
