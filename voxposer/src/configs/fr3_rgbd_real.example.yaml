rgbd:
  topics:
    color: /camera/color/image_raw
    depth: /camera/aligned_depth_to_color/image_raw
    camera_info: /camera/color/camera_info

  camera_frame_override: camera_color_optical_frame
  target_frame: fr3_link0
  sync_tolerance_sec: 0.05
  tf_timeout_sec: 0.20
  integer_depth_scale: 0.001

  stream:
    host: 127.0.0.1
    port: 8765
    timeout_sec: 5.0

  point_cloud:
    min_depth_m: 0.10
    max_depth_m: 2.50
    stride: 2

  # Replace these values with the measured safe workspace before hardware use.
  workspace:
    min: [0.28, -0.70, -0.05]
    max: [0.90, 0.70, 0.80]

  # This color-rule example is only suitable for controlled validation props.
  # Replace it with the real detector/segmenter before general object use.
  segmentation:
    type: color_rules
    objects:
      pick_object:
        aliases: [pick object, red cube, red block]
        dominant_channel: red
        min_value: 180
        dominance_ratio: 2.0
      place_target:
        aliases: [place target, green target, green area]
        dominant_channel: green
        min_value: 90
        dominance_ratio: 1.35

